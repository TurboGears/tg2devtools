<html py:extends="master.xhtml" py:strip="True">
  <head py:block="head" py:strip="True">
    <title py:block="master_title">Login</title>
  </head>

  <body py:block="body" py:strip="True">
    <h1>Login</h1>

    <div class="row">
      <div class="col-md-8 col-lg-6">
        <form action="${tg.url('/login_handler', params=dict(came_from=came_from, __logins=login_counter))}"
              method="post" accept-charset="UTF-8">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" type="text" name="login" value="${login}"/>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password"/>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="remember" value="2252000" id="remember" />
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>
    </div>
  </body>
</html>
