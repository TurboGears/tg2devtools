<!DOCTYPE html>

<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta charset="${response.charset}" />

  <title py:block="master_title">TurboGears</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" media="screen" href="${tg.url('/css/style.css')}" />

  <py:block name="head"></py:block>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="${tg.url('/demo')}">
        ${getattr(tmpl_context, 'project_name', 'turbogears2')}
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-content" aria-controls="navbar-content" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbar-content">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link ${('active' if self.defined('page') and page=='demo' else '')}" href="${tg.url('/demo')}">Demo</a></li>
        </ul>
        <ul py:if="tg.auth_stack_enabled" class="navbar-nav">
          <li py:if="not request.identity" class="nav-item"><a class="nav-link" href="${tg.url('/login')}">Login</a></li>
          <li py:if="request.identity" class="nav-item"><a class="nav-link" href="${tg.url('/logout_handler')}">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <py:with vars="flash=tg.flash_obj.render('flash', use_js=False)">
      <div py:if="flash" py:replace="Markup(flash)" />
    </py:with>

    <py:block name="body"></py:block>
  </main>

  <footer class="container border-top mt-5 py-3 text-muted small">
    Powered by TurboGears, Kajiki, Bootstrap, and htmx.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</body>
</html>
